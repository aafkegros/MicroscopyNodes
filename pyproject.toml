[tool.poetry]
name = "microscopynodes"
version = "2.2.6"
description = "Loading and handling microscopy data in Blender."
authors = ["Oane Gros <oane.gros@embl.de>"]
include = [
    {path = "README.md"}
]
[[tool.poetry.source]]
name = "dailybpy"
url = "https://bradyajohnston.github.io/dailybpy/"
priority = "explicit"

[tool.poetry.dependencies]
python = "==3.13.9"
# bpy = { version = "==5.1.0b", source = "dailybpy" }
bpy = "==5.1.0"
dask = "==2026.1.2"
importlib-metadata = "==8.7.0"
tifffile = "==2026.2.24"
imagecodecs = "==2026.1.14"
zarr = "==3.1.5"
fsspec = "==2026.2.0"
cmap = "==0.7.1"
s3fs = "==2026.2.0"
zmesh = "1.10.0"


[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-snapshot = "*"
imageio = "*"
mike = "*"

[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools_scm]

