name: test-addon

on: 
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        blender-version: ["4.4.0"]
        os: [ubuntu-latest, windows-latest, macos-13]
        # os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      # - run: pip install bpy==${{ matrix.blender-version }}

            
      - name: Install poetry
        run: pip install poetry
      - name: Install with retries
        run: |
            for i in 1 2 3; do
                poetry install --with=dev && break
                sleep 10
            done
      - name: install
        run: pip install -r requirements.txt
      
      - name: Install microscopy nodes
        run: pip install .
 
     
      - name: Run Tests
        run: pytest --verbose 
