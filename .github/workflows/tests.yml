name: test-addon

on: 
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.9'

      - name: Install poetry
        run: pip install poetry==2.3.2

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            poetry install --with=dev --no-interaction && exit 0
            sleep $((attempt * 20))
          done
          exit 1

      - name: Align numpy with Blender
        run: poetry run pip install --no-deps --force-reinstall numpy==2.3.4

      - name: Run Tests
        run: poetry run pytest --verbose
