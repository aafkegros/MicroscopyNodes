name: test-addon

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        blender-version: ["5.1.0b"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.9"
          cache: "pip"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies with retries
        shell: bash
        run: |
          for i in 1 2 3; do
            poetry install --with dev && break
            sleep 10
          done

      - name: Run tests
        run: poetry run pytest --verbose