site_name: Microscopy Nodes
repo_url: https://github.com/aafkegros/MicroscopyNodes
nav:
  - Home: index.md
  - Start here:
    - Install and learn Blender basics: tutorials/1_start.md
    - Load microscopy data: tutorials/2_loading_data.md
    - How Microscopy Nodes works: tutorials/workflow_overview.md
  - Core workflows:
    - Adjust color, contrast, and opacity: tutorials/visualization.md
    - Slice, mask, and recolor: tutorials/slicing_masking.md
    - Visualize dense EM data: tutorials/dense_em.md
    - Work with time-series data: tutorials/time_series.md
    - Cameras, animation, and output: tutorials/creating_output.md
    - Scale bars, grids, and time labels: tutorials/annotation.md
  - Advanced workflows:
    - Large datasets and sparse reloading: tutorials/large_data.md
    - Project volume data onto meshes: tutorials/mesh_projection.md
    - Surface modification: tutorials/surface_smoothing.md
  - Reference:
    - Objects and modifiers: tutorials/3_objects.md
    - Shading:
      - Overview: tutorials/4_shading.md
      - Volume shading: tutorials/4_volume_shading.md
      - Surface shading: tutorials/4_surface_shading.md
      - Labelmask shading: tutorials/4_labelmask_shading.md
    - Rendering settings: tutorials/rendering.md
    - Preferences: tutorials/preferences.md
  - Troubleshooting and support:
    - OME-Zarr troubleshooting: tutorials/ome_zarr_troubleshooting.md
    - Help and contact: faq.md
    - Blender versions before 4.2: outdated.md


theme:
  name: material
  font:
    text: Rubik
  logo: figures/logo.svg
  favicon: figures/favicon.svg
  features:
    - navigation.tabs

extra:
  version:
    provider: mike

plugins:
  - include-markdown
  - search
  - macros:
      module_name: mkdocs_macros

markdown_extensions:
  - pymdownx.snippets
  - attr_list
  - admonition
  - codehilite
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji
  - pymdownx.mark
  - pymdownx.tabbed
  - pymdownx.details


extra_css:
  - stylesheets/extra_css.css

extra_javascript:
  - javascript/lazy_yt.js 
